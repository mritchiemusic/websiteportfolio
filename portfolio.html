  <main class="container">
    <h1></h1>
    <p></p>
<div class="portfolio-grid">
  <div class="portfolio-item" onclick="openProject('Space Explorers: The ISS Experience', 'VR - Emmy Award winning four part documentary filmed aboard the International Space Station.', 'photos/portfolio_spaceexplorers.jpg')">
    <img src="photos/portfolio_spaceexplorers.jpg" alt="Space Explorers: The ISS Experience">
    <div class="overlay">
      <div class="text">
        <h3>Space Explorers: The ISS Experience</h3>
        <p>VR</p>
        <p>Four part documentary filmed aboard the ISS</p>
      </div>
    </div>
  </div>

  <div class="portfolio-item" onclick="openProject('Space Explorers: Mission to the Moon', 'VR - Following astronaut training for future moon missions.', 'photos/portfolio_missiontothemoon.jpg')">
    <img src="photos/portfolio_missiontothemoon.jpg" alt="Space Explorers: Mission to the Moon">
    <div class="overlay">
      <div class="text">
        <h3>Space Explorers: Mission to the Moon</h3>
        <p>VR</p>
        <p>Following astronaut training for future moon missions</p>
      </div>
    </div>
  </div>



</div>

  </main>
<div id="projectModal" class="modal">
  <div class="modal-content">
    <span class="close-button">&times;</span>
    <div id="modal-body">
      </div>
  </div>
</div>

  <footer>
    <p></p>
  </footer>

<script>
  const modal = document.getElementById("projectModal");
  const closeBtn = document.querySelector(".close-button");

  // Function to open modal
function openProject(title, description, imagePath) {
  const modalBody = document.getElementById("modal-body");
  
  modalBody.innerHTML = `
    <img src="${imagePath}" style="width:100%; border-radius: 4px; margin-bottom: 20px;">
    <h2>${title}</h2>
    <p style="font-size: 1.1rem; line-height: 1.6; color: #444;">${description}</p>
  `;
  
  document.getElementById("projectModal").style.display = "block";
}

  // Close when clicking 'X'
  closeBtn.onclick = () => modal.style.display = "none";

  // Close when clicking outside the box
  window.onclick = (event) => {
    if (event.target == modal) modal.style.display = "none";
  }
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    document.getElementById("projectModal").style.display = "none";
  }
});
</script>

</body>
</html>
