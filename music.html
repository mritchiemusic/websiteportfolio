  <script>
function toggleAudio(id) {
  const audio = document.getElementById(id);
  const parentCard = audio.parentElement; // Finds the .album-item
  const allAudios = document.querySelectorAll('audio');

  allAudios.forEach(track => {
    if (track !== audio) {
      track.pause();
      track.parentElement.classList.remove('playing'); // Remove icon from others
    }
  });

  if (audio.paused) {
    audio.play();
    parentCard.classList.add('playing');
  } else {
    audio.pause();
    parentCard.classList.remove('playing');
  }
}

// Automatically reset the icon when the song ends
document.querySelectorAll('audio').forEach(track => {
  track.onended = function() {
    this.parentElement.classList.remove('playing');
  };
});

document.querySelectorAll('audio').forEach(track => {
  track.onended = function() {
    this.currentTime = 0; 
    this.parentElement.classList.remove('playing');
  };
});

  </script>
