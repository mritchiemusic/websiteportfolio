  <script>
function toggleAudio(id) {
  const audio = document.getElementById(id);
  const allAudios = document.querySelectorAll('audio');

  // Stop all other tracks from playing
  allAudios.forEach(track => {
    if (track !== audio) {
      track.pause();
      track.currentTime = 0;
    }
  });

  // Toggle Play/Pause for the clicked track
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}
  </script>
